import com.android.build.gradle.LibraryExtension
import com.android.build.gradle.LibraryPlugin

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    jcenter()
    maven {
      url "https://plugins.gradle.org/m2/"
    }
    maven {
      url 'http://192.168.103.116:9090/artifactory/libs-release-local'
    }
  }
  dependencies {
    classpath PluginsDependencies.androidBuild
    classpath PluginsDependencies.kotlinGradlePlugin
    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
  }
}

allprojects {
  repositories {
    google()
    jcenter()
    maven {
      url "https://plugins.gradle.org/m2/"
    }
    maven { url "https://jitpack.io" }
    maven {
      url 'http://192.168.103.116:9090/artifactory/libs-release-local'
    }
  }

  afterEvaluate {
    extensions.findByName('kapt')?.arguments {
      arg("dagger.formatGeneratedSource", "disabled")
      arg("dagger.gradle.incremental", "enabled")
    }
  }

  plugins.whenPluginAdded {
    if (it instanceof LibraryPlugin) {
      extensions.getByType(LibraryExtension).libraryVariants.all {
        it.generateBuildConfigProvider.configure { variant -> variant.enabled = true
        }
      }
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
