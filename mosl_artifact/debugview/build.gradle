apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
  namespace 'com.mosl.debugview'
  compileSdkVersion Versions.compileSdkVersion

  defaultConfig {
    minSdkVersion 21
    targetSdkVersion Versions.targetSdkVersion
  }

  viewBinding {
    enabled = true
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation AndroidxDependencies.appcompat
  implementation AndroidxDependencies.legacy
  implementation AndroidxDependencies.fragment
  implementation AndroidxDependencies.constraintLayout

  //Dagger
  implementation DaggerDependencies.core
  kapt DaggerDependencies.compiler

  //RxJava 2.0
  implementation RxDependencies.java
  implementation RxDependencies.android


  implementation RxBindingDependencies.bindingCore
  implementation "com.jakewharton.madge:madge:1.1.4"
  implementation 'com.jakewharton:process-phoenix:2.0.0'
  debugImplementation LeakCanaryDependencies.debug
  implementation 'com.jakewharton.threetenabp:threetenabp:1.2.2'
  implementation OkHttpDependencies.core
  implementation RetrofitDependencies.core
  implementation RetrofitDependencies.mock
  implementation AgicDependencies.timber

  implementation KotlinDependencies.kotlin

//  implementation deps.mofslArtifacts.debugviewcore
//  compileOnly deps.mofslArtifacts.appcore

  implementation project(':debugviewcore')
  compileOnly project(':appcore')
  implementation project(':rx_preferences')
}
kotlin {
  jvmToolchain(17)
}
//apply from: rootProject.file('gradle/gradle-mvn-push.gradle')