apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
  namespace 'com.mosl.token.manager'
  compileSdkVersion Versions.compileSdkVersion

  defaultConfig {
    minSdkVersion 15
    targetSdkVersion Versions.targetSdkVersion
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  compileOnly AndroidxDependencies.annotation

  implementation "com.jakewharton.timber:timber:4.7.1"
  compileOnly KotlinDependencies.kotlin
  compileOnly RxDependencies.java
  compileOnly RxDependencies.relay

//  compileOnly deps.mofslArtifacts.moslcommons
//  compileOnly deps.mofslArtifacts.appcore

  compileOnly project(':moslcommons')
  compileOnly project(':appcore')

  compileOnly DaggerDependencies.core
  kapt DaggerDependencies.compiler
}

