apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'com.mosl.navigator'
  compileSdkVersion Versions.compileSdkVersion

  defaultConfig {
    minSdkVersion 15
    targetSdkVersion Versions.targetSdkVersion
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
kotlin {
  jvmToolchain(17)
}
dependencies {
  implementation DaggerDependencies.javax
//    implementation project(':artifact_annotations')
//  compileOnly deps.mofslArtifacts.annotation
  compileOnly project(':artifact_annotations')
  compileOnly AndroidxDependencies.fragment
  compileOnly KotlinDependencies.kotlin
  compileOnly AgicDependencies.timber
}

