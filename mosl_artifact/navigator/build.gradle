apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  compileSdkVersion Versions.compileSdkVersion
  buildToolsVersion Versions.buildToolsVersion

  defaultConfig {
    minSdkVersion 15
    targetSdkVersion Versions.targetSdkVersion
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation DaggerDependencies.javax
//    implementation project(':artifact_annotations')
//  compileOnly deps.mofslArtifacts.annotation
  compileOnly project(':artifact_annotations')
  compileOnly AndroidxDependencies.fragment
  compileOnly KotlinDependencies.kotlin
  compileOnly Dependencies.timber
}

