apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
  compileSdkVersion Versions.compileSdkVersion
  buildToolsVersion Versions.buildToolsVersion

  defaultConfig {
    minSdkVersion 17
    targetSdkVersion Versions.targetSdkVersion
    vectorDrawables.useSupportLibrary true
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation 'androidx.annotation:annotation:1.1.0'
  implementation AndroidxDependencies.appcompat
  implementation AndroidxDependencies.material
  implementation AndroidxDependencies.recyclerView
  implementation 'androidx.viewpager2:viewpager2:1.0.0'

  /*implementation deps.mofslArtifacts.moslcommons
  implementation deps.mofslArtifacts.appcore
  implementation deps.mofslArtifacts.domaincore
  implementation deps.mofslArtifacts.navigator*/
  implementation project(':moslcommons')
  implementation project(':appcore')
  implementation project(':navigator')
  implementation project(':domaincore')
//  implementation project(':moslcommons')

  compileOnly Dependencies.timber
  compileOnly RxDependencies.java
  compileOnly RxDependencies.android
  compileOnly KotlinDependencies.kotlin
  compileOnly DaggerDependencies.core
  compileOnly DaggerDependencies.android
//  compileOnly Dependencies.flashBar
  compileOnly project(':flashbar')
  implementation "com.airbnb.android:lottie:3.4.0"

  kapt DaggerDependencies.compiler
}

