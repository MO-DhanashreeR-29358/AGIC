android {
    namespace "com.mosl.mobile.rm"
    packagingOptions {
        exclude 'META-INF/annotations.kotlin_module'
        exclude 'META-INF/rxbinding_release.kotlin_module'
        exclude 'META-INF/rxbinding-core_release.kotlin_module'
        exclude 'META-INF/androidx.preference_preference.version'
    }
    compileSdkVersion Versions.compileSdkVersion
    buildToolsVersion Versions.buildToolsVersion

    Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(file('../version.properties')))

    Properties keystoreProps = new Properties()
    keystoreProps.load(new FileInputStream(file('../keystore.properties')))

    defaultConfig {
        applicationId "com.mosl.mobile.rm"
        minSdkVersion Versions.minSdkVersion
        targetSdkVersion Versions.targetSdkVersion

       /* buildConfigField 'String', 'GIT_SHA', "\"${gitSha()}\""
        buildConfigField 'long', 'GIT_TIMESTAMP', "${gitTimestamp()}L"*/

        resConfigs "en", "hi"
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        uat {
            try {
                storeFile file('../agicapp.jks')
                storePassword keystoreProps['KEYSTORE_PASSWORD']
                keyAlias keystoreProps['UAT_ALIAS']
                keyPassword keystoreProps['UAT_ALIAS_PASSWORD']
            } catch (ex) {
                throw new InvalidUserDataException(
                        "You should define KEYSTORE_PASSWORD, UAT_ALIAS & UAT_ALIAS_PASSWORD in keystore.properties")
            }
        }
        prod {
            try {
                storeFile file('../agicapp.jks')
                storePassword keystoreProps['KEYSTORE_PASSWORD']
                keyAlias keystoreProps['PROD_ALIAS']
                keyPassword keystoreProps['PROD_ALIAS_PASSWORD']
            } catch (ex) {
                throw new InvalidUserDataException(
                        "You should define KEYSTORE_PASSWORD, PROD_ALIAS & PROD_ALIAS_PASSWORD in keystore.properties")
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    dataBinding {
        enabled = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    flavorDimensions 'releaseType'
    productFlavors {
        internal {
            versionCode versionProps['code'].toInteger()
            versionName versionProps['name']
            applicationIdSuffix '.internal'
            buildConfigField 'boolean', 'LOGOUT_ON_UPDATE', "${versionProps['clearUserLogin']}"
            signingConfig signingConfigs.uat
            //TODO Remove below lines before giving UAT release
            minSdkVersion 21
            dimension 'releaseType'
        }
        production {
            versionCode versionProps['prodCode'].toInteger()
            versionName versionProps['prodName']
            buildConfigField 'boolean', 'LOGOUT_ON_UPDATE', "${versionProps['prodClearUserLogin']}"
            signingConfig signingConfigs.prod
            dimension 'releaseType'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            multiDexEnabled true
            ext.alwaysUpdateBuildId = false
            ext.enableCrashlytics = false
            manifestPlaceholders = [crashlyticsEnabled: false]
        }
        release {
            debuggable true
            manifestPlaceholders = [crashlyticsEnabled: true]
            multiDexEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFile 'proguard-conceal.pro'
            proguardFile 'proguard-crashlytics.pro'
            proguardFile 'proguard-retrofit.pro'
            proguardFile 'proguard-dagger.pro'
            proguardFile 'proguard-gson.pro'
            proguardFile 'proguard-okhttp.pro'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${project.name}-${variant.name}-${variant.versionName}.apk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled false
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        check 'NewApi', 'SyntheticAccessor'
        ignoreWarnings false
    }

    dexOptions {
        javaMaxHeapSize "2g"
    }
}

