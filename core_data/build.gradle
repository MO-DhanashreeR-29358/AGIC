apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

android {
  compileSdkVersion Versions.compileSdkVersion
  buildToolsVersion Versions.buildToolsVersion

  defaultConfig {
    minSdkVersion Versions.minSdkVersion
    targetSdkVersion Versions.targetSdkVersion
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles 'consumer-rules.pro'
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  implementation KotlinDependencies.kotlin
  implementation AndroidxDependencies.appcompat
  implementation KotlinDependencies.ktxCore
  testImplementation TestingDependencies.junit

  implementation DaggerDependencies.core
  kapt DaggerDependencies.compiler

  implementation RetrofitDependencies.core
  implementation RetrofitDependencies.rxJava
  implementation RetrofitDependencies.mock
  implementation RetrofitDependencies.protoBuf exclude group: 'com.google.protobuf'

  implementation MoshiDependencies.core
  implementation MoshiDependencies.retrofitConvertor
  kapt MoshiDependencies.codegen

  implementation RxDependencies.java
  implementation RxDependencies.kotlin
  implementation RxDependencies.android
  implementation RxDependencies.relay
  implementation RxDependencies.preferences

  debugImplementation StethoDependencies.core
  debugImplementation StethoDependencies.okHttp

  implementation Dependencies.timber

  androidTestImplementation AndroidxDependencies.testRunner
  androidTestImplementation AndroidxDependencies.testEspresso

  debugImplementation OkHttpDependencies.logger
  debugImplementation OkHttpDependencies.core
  implementation MofslArtifactDependencies.conceal

  implementation MofslArtifactDependencies.moslCommons
  implementation MofslArtifactDependencies.appCore
  implementation MofslArtifactDependencies.apiCore
  debugImplementation MofslArtifactDependencies.debugViewCore
  implementation MofslArtifactDependencies.annotation
  implementation RetrofitDependencies.gson
  implementation GsonDependencies.gson

  implementation project(':mosl_api')
  implementation project (':mock_data')
  implementation project (':annotations')
  implementation project (':app_user')
  implementation project (':shared')

}
